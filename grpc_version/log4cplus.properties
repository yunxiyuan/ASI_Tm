# log4cplus 日志配置
# 语法:log4cplus.rootLogger=<级别>, <appender名>...
# 级别升序:TRACE < DEBUG < INFO < WARN < ERROR < FATAL
# 改这一行即可全局调级别(无需重编译),例如改成 WARN 则 DEBUG/INFO 被丢弃
log4cplus.rootLogger=DEBUG, CONSOLE, FILE

# ---- 控制台输出 ----
log4cplus.appender.CONSOLE=log4cplus::ConsoleAppender
log4cplus.appender.CONSOLE.layout=log4cplus::PatternLayout
# %D 日期  %-5p 级别左对齐5宽  %c logger名  %m 消息  %n 换行
log4cplus.appender.CONSOLE.layout.ConversionPattern=%D{%H:%M:%S} %-5p [%c] %m%n

# ---- 滚动文件输出 ----
# 文件超过 MaxFileSize 自动滚动,保留 MaxBackupIndex 个历史备份
# CreateDirs=true:自动创建 logs/ 目录(否则目录不存在时静默写失败)
log4cplus.appender.FILE=log4cplus::RollingFileAppender
log4cplus.appender.FILE.CreateDirs=true
log4cplus.appender.FILE.File=logs/asi.log
log4cplus.appender.FILE.MaxFileSize=5MB
log4cplus.appender.FILE.MaxBackupIndex=3
log4cplus.appender.FILE.layout=log4cplus::PatternLayout
log4cplus.appender.FILE.layout.ConversionPattern=%D{%Y-%m-%d %H:%M:%S} %-5p [%c] %m%n
